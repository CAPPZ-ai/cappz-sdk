# CAPPZ counterparty check — Cloudflare Worker (free plan: Workers + D1).
# Deploy: see README.md. The report-signing key is a secret: wrangler secret put CHECK_SIGNING_SEED
name = "cappz-check"
main = "worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Served at check.cappz.ai (custom domain on the cappz.ai zone) and at the account's workers.dev address.
routes = [{ pattern = "check.cappz.ai", custom_domain = true }]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "cappz-check"
database_id = "cbf70970-3ad3-4d7b-be20-598552dddb7e"

[vars]
PRICE_XRP = "0.01"
# CAPPZ treasury (config/cappz.json networks.*.treasury): public addresses only.
PAY_TO_MAINNET = "rUqPbiwe2Z5rj2AewokbFHCGQPtwjtzjHM"
PAY_TO_TESTNET = "rnQ3gydd9kTdx6gHKzhNHSKHSq6whzdiMe"
# The marketplace's public log (https://cappz.ai/.well-known/cappz-market.json): read-only, publishable key.
