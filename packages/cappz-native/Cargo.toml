[package]
name = "cappz-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CAPPZ native kernels: GF(2^8) Reed-Solomon matrix multiply and SHA-256, with NEON/ARMv8 Crypto, WASM SIMD and portable paths."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Compile the C++ twins of the kernels (cpp/) so `bench` can compare Rust and C++ in one process.
cpp = ["dep:cc"]
# Compare against the RustCrypto sha2 crate in `bench`.
sha2-crate = ["dep:sha2"]

[dependencies]
sha2 = { version = "0.10", optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.wasm]
inherits = "release"
opt-level = 3
