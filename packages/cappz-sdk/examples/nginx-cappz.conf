# nginx in front of a CAPPZ edge node: public-CA TLS for browsers, CAPPZ verification at the edge.
server {
  listen 443 ssl;
  server_name api.example.com;
  ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;   # public CA: browsers trust only these
  ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
  ssl_verify_client optional_no_ca;   # accept wallet-projected client certificates (self-signed); the gateway decides

  # Verify every API request at the edge; the app sees only verified traffic.
  location = /_cappz_verify {
    internal;
    proxy_pass http://127.0.0.1:41446/cappz/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-Host $host;
    proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
  }
  location /api/ {
    auth_request /_cappz_verify;
    auth_request_set $cappz_trust $upstream_http_cappz_verified_trust;
    auth_request_set $cappz_wallet $upstream_http_cappz_verified_wallet;
    proxy_set_header Cappz-Verified-Trust $cappz_trust;
    proxy_set_header Cappz-Verified-Wallet $cappz_wallet;
    proxy_pass http://127.0.0.1:8080;   # your app: check the body against Content-Digest (checkContentDigest)
  }

  # DMZ drop box and released files for legacy senders and internal clients.
  location /legacy/ {
    client_max_body_size 64m;
    proxy_pass http://127.0.0.1:41447/legacy/;
    proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
  }

  # Replicator relay (copies behind firewalls).
  location /cpz1/ {
    proxy_pass http://127.0.0.1:41445/cpz1/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
